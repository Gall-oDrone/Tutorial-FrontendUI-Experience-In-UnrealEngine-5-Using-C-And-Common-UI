; Session backend (Plugins/FrontendMultiplayer/Docs/SessionBackend.md).
; Null = LAN-only sessions for local testing; the UFrontendSessionBackend_OSS class
; is the same for every service. EOS is switched on per launch, not here:
;   Scripts\LaunchInstances.bat 2 EOS
; adds -ini:Engine:[OnlineSubsystem]:DefaultPlatformService=EOS. See Docs/EOSSetup.md.
[OnlineSubsystem]
DefaultPlatformService=Null

[OnlineSubsystemEOS]
bEnabled=true

; Product keys (ProductId, SandboxId, DeploymentId, ClientId, ClientSecret,
; EncryptionKey) are NOT here. They go in the git-ignored
; Saved/Config/WindowsEditor/Engine.ini as one +Artifacts=(...) line under this same
; section, named FrontendUI to match DefaultArtifactName. Docs/EOSSetup.md has the template.
[/Script/OnlineSubsystemEOS.EOSSettings]
DefaultArtifactName=FrontendUI
bUseEAS=True
bUseEOSConnect=True
bUseEOSSessions=True
bMirrorPresenceToEAS=True
bShouldEnforceBeingLaunchedByEGS=False
bEnableOverlay=False
bEnableSocialOverlay=False
CacheDir=CacheDir

; NetDriverEOS carries the match over EOS P2P when the connect URL is an EOS one and
; passes straight through to IP sockets otherwise (LAN hosts travel with ?bIsLanMatch,
; dedicated servers are not EOS clients). The fallback covers builds without the plugin.
[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="OnlineSubsystemEOS.NetDriverEOS",DriverClassNameFallback="OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="/Script/Engine.DemoNetDriver",DriverClassNameFallback="/Script/Engine.DemoNetDriver")

[/Script/OnlineSubsystemEOS.NetDriverEOS]
bIsUsingP2PSockets=true


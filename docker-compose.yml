services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: frontendui-server:latest
    container_name: frontendui-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-7777}:${SERVER_PORT:-7777}/udp"
    # docker/entrypoint.sh builds the engine command line from these. With no GAMELIFT_SDK_*
    # variables the server runs as a plain FixedAddress dedicated server (LaunchInstances.bat
    # N DEDICATED); with them it registers on the GameLift fleet (Docs/GameLift.md).
    environment:
      - SERVER_MAP=${SERVER_MAP:-/Game/Maps/L_MatchTest}
      - SERVER_PORT=${SERVER_PORT:-7777}
      - SERVER_SESSION_BACKEND=${SERVER_SESSION_BACKEND:-}
      - SERVER_EXTRA_ARGS=${SERVER_EXTRA_ARGS:-}
      - GAMELIFT_SDK_WEBSOCKET_URL=${GAMELIFT_SDK_WEBSOCKET_URL:-}
      - GAMELIFT_SDK_FLEET_ID=${GAMELIFT_SDK_FLEET_ID:-}
      - GAMELIFT_SDK_HOST_ID=${GAMELIFT_SDK_HOST_ID:-}
      - GAMELIFT_SDK_PROCESS_ID=${GAMELIFT_SDK_PROCESS_ID:-}
      - GAMELIFT_SDK_AUTH_TOKEN=${GAMELIFT_SDK_AUTH_TOKEN:-}
      - GAMELIFT_REGION=${GAMELIFT_REGION:-us-east-1}
      - AWS_REGION=${AWS_REGION:-us-east-1}
